name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, dom, ftp, gd, iconv, intl, mbstring, mysqli, pdo_mysql, posix, simplexml, soap, zip
          coverage: none
          tools: composer:v2

      # No composer.lock is committed (this is a module), so this resolves the newest allowed versions.
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Lint
        run: composer lint

      - name: PHPStan
        run: composer phpstan

      - name: PHPUnit
        run: composer test
